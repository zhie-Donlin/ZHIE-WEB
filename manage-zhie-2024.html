<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex,nofollow"/>
<title>致一科技 — 網站後台</title>
<link rel="icon" type="image/png" href="logo.png"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="site-schema.js"></script>
<style>
/*
 * 致一科技 網站後台(真登入版)
 * - 登入:Supabase Auth(Email+密碼),不再有寫死帳密。
 * - 管理員名單:資料庫表 site_admins(見 sql/01_*.sql)。新增管理員 = 先在 Supabase Authentication 建使用者,再把 email 加進 site_admins。
 * - 可改的網站文字/圖片清單與欄位定義:site-schema.js。資料存在 site_settings(key,value)。
 * - 產品:products 表。詢價:inquiries 表。圖片:Storage bucket「products」下的 site/ 資料夾。
 */
*{box-sizing:border-box;margin:0;padding:0;}
:root{--blue:#1a56db;--navy:#0f2057;--bg:#f4f6f9;--line:#dde2ed;--mute:#6b7a99;--red:#c0392b;--green:#1e8e3e;}
body{font-family:'Noto Sans TC','Segoe UI',system-ui,sans-serif;background:var(--bg);color:#1c2333;font-size:15px;line-height:1.6;}
button{font-family:inherit;cursor:pointer;}
.btn{display:inline-block;padding:9px 18px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-size:14px;color:var(--navy);}
.btn:hover{border-color:var(--blue);}
.btn-p{background:var(--blue);border-color:var(--blue);color:#fff;}
.btn-p:hover{background:#1348c0;}
.btn-d{color:var(--red);border-color:#f0c4be;}
.btn-s{padding:5px 11px;font-size:13px;}
input[type=text],input[type=email],input[type=password],input[type=number],textarea,select{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;font:inherit;font-size:14px;background:#fff;}
textarea{min-height:80px;resize:vertical;}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--blue);}
label.l{display:block;font-size:12px;color:var(--mute);margin:12px 0 4px;}
#login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;width:100%;max-width:380px;box-shadow:0 8px 30px rgba(15,32,87,.08);}
#app{display:none;}
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:56px;gap:8px;}
.top b{color:var(--navy);font-size:16px;}
.top .r{display:flex;gap:8px;align-items:center;}
.menu-btn{display:none;}
.layout{display:flex;}
.side{width:230px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);min-height:calc(100vh - 56px);padding:10px 0;}
.side a{display:block;padding:10px 20px;font-size:14px;color:#3d4d6b;cursor:pointer;border-left:3px solid transparent;}
.side a:hover{background:var(--bg);}
.side a.on{background:#e8effd;color:var(--blue);border-left-color:var(--blue);font-weight:600;}
.side .g{font-size:11px;color:var(--mute);padding:12px 20px 4px;letter-spacing:.08em;}
.main{flex:1;min-width:0;padding:22px;max-width:960px;}
h1{font-size:20px;color:var(--navy);margin-bottom:4px;}
.sub{color:var(--mute);font-size:13px;margin-bottom:16px;}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;}
.item{border:1px dashed var(--line);border-radius:10px;padding:12px;margin:10px 0;background:#fafbfd;}
.item .h{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
.tg{display:flex;align-items:center;gap:8px;margin:14px 0 2px;font-size:14px;}
.tg input{width:18px;height:18px;}
.imgbox{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.imgbox img{max-height:90px;max-width:160px;border:1px solid var(--line);border-radius:8px;background:#fff;object-fit:contain;}
.savebar{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:14px 0 6px;display:flex;gap:10px;align-items:center;}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:10px 22px;border-radius:10px;font-size:14px;z-index:99;display:none;max-width:90vw;}
#toast.err{background:var(--red);}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
th{color:var(--mute);font-size:12px;font-weight:600;}
.badge{font-size:11px;padding:2px 8px;border-radius:10px;background:#e8effd;color:var(--blue);}
.badge.off{background:#eee;color:#888;}
.modal{position:fixed;inset:0;background:rgba(15,32,87,.45);display:none;align-items:flex-start;justify-content:center;padding:16px;z-index:60;overflow-y:auto;}
.modal.on{display:flex;}
.modal .in{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:680px;margin:20px 0;}
.warn{background:#fff6e0;border:1px solid #f0d58a;color:#7a5b00;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px;}
@media(max-width:800px){
  .menu-btn{display:inline-block;}
  .side{position:fixed;left:0;top:56px;bottom:0;z-index:30;transform:translateX(-100%);transition:transform .2s;overflow-y:auto;}
  .side.open{transform:none;box-shadow:4px 0 20px rgba(0,0,0,.15);}
  .main{padding:14px;}
  .row2{grid-template-columns:1fr;}
  .tbl-wrap{overflow-x:auto;}
}
</style>
</head>

<!-- 登入 -->
<div id="login">
  <div class="box">
    <div style="text-align:center;margin-bottom:18px;">
      <img src="logo.png" alt="ZHIE" style="height:56px;" onerror="this.style.display='none'"/>

<div id="toast"></div>

<script>
var SB_URL='https://zyzmadwlvlgoamppaosg.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5em1hZHdsdmxnb2FtcHBhb3NnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NjI4NjYsImV4cCI6MjA5NjEzODg2Nn0.fyzo1dhruC3PB3ioSL64c8GLLrK7hcR5updxgrmiBnI';
var sb=supabase.createClient(SB_URL,SB_KEY);   // 公開的匿名金鑰(本來就會出現在前台);真正的權限由登入+資料庫規則決定

var RAW={}, CUR={}, SIZEIMGS={}, CURPAGE='';
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function $(id){return document.getElementById(id);}
function toast(msg,err){var t=$('toast');t.textContent=msg;t.className=err?'err':'';t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(function(){t.style.display='none';},err?6000:2500);}

/* ============ 登入 ============ */
async function doLogin(){
  var e=$('lg-email').value.trim(), p=$('lg-pass').value;
  $('lg-err').style.display='none';
  if(!e||!p){showLgErr('請輸入 Email 與密碼');return;}
  var r=await sb.auth.signInWithPassword({email:e,password:p});
  if(r.error){showLgErr('Email 或密碼錯誤');return;}
  await enter(r.data.session);
}
function showLgErr(m){var x=$('lg-err');x.textContent=m;x.style.display='block';}
async function doLogout(){await sb.auth.signOut();location.reload();}
var ADMIN_TABLE_MISSING=false;
async function enter(session){
  if(!session){return;}
  var r=await sb.from('site_admins').select('email');
  if(r.error){ADMIN_TABLE_MISSING=true;}   // 管理員名單表還沒建立(SQL 01 尚未執行):暫時放行
  else if(!r.data||!r.data.length){await sb.auth.signOut();showLgErr('此帳號不是網站管理員');return;}
  $('who').textContent=session.user.email;
  $('login').style.display='none';$('app').style.display='block';
  await loadSettings();
  buildSide();
  go('sec:common');
}
(async function(){var r=await sb.auth.getSession();if(r.data&&r.data.session)enter(r.data.session);})();

/* ============ 設定讀寫 ============ */
async function loadSettings(){
  var r=await sb.from('site_settings').select('*');
  RAW={};(r.data||[]).forEach(function(x){RAW[x.key]=x.value;});
  CUR=zhieMerge(RAW);
  try{SIZEIMGS=JSON.parse(RAW.size_imgs||'{}')||{};}catch(e){SIZEIMGS={};}
}
async function saveRows(rows){
  rows.forEach(function(r){r.updated_at=new Date().toISOString();});
  var r=await sb.from('site_settings').upsert(rows,{onConflict:'key'});
  if(r.error){toast('儲存失敗:'+r.error.message,true);return false;}
  rows.forEach(function(x){RAW[x.key]=x.value;});
  return true;
}

/* ============ 側邊選單 ============ */
function buildSide(){
  var h='<div class="g">網站內容</div>';
  ZHIE_SCHEMA.forEach(function(s){h+='<a data-p="sec:'+s.id+'" onclick="go(\'sec:'+s.id+'\')">'+esc(s.title.replace(/\(.*$/,''))+'</a>';});
  h+='<div class="g">資料管理</div>'
   +'<a data-p="products" onclick="go(\'products\')">產品上下架・修改</a>'
   +'<a data-p="sizes" onclick="go(\'sizes\')">各尺寸卡片照片</a>'
   +'<a data-p="inq" onclick="go(\'inq\')">詢價收件匣</a>';
  $('side').innerHTML=h;
}
function go(p){
  CURPAGE=p;
  document.querySelectorAll('#side a').forEach(function(a){a.classList.toggle('on',a.getAttribute('data-p')===p);});
  $('side').classList.remove('open');
  window.scrollTo(0,0);
  if(p.indexOf('sec:')===0) renderSection(p.slice(4));
  else if(p==='products') renderProducts();
  else if(p==='sizes') renderSizes();
  else if(p==='inq') renderInq();
}

/* ============ 通用欄位編輯(依 site-schema.js 自動產生) ============ */
function fieldHtml(f,val,ctx){   // ctx: 屬性字串,標記這個欄位屬於哪個 key/第幾筆
  var id=ctx;
  if(f.type==='toggle') return '<label class="tg"><input type="checkbox" '+id+' '+(val==='1'?'checked':'')+'/> '+esc(f.label)+'</label>';
  var h='<label class="l">'+esc(f.label)+'</label>';
  if(f.type==='textarea') return h+'<textarea '+id+'>'+esc(val)+'</textarea>';
  if(f.type==='image') return h+'<div class="imgbox">'+(val?'<img src="'+esc(val)+'"/>':'<span style="color:var(--mute);font-size:13px;">尚未設定圖片</span>')
      +'<button class="btn btn-s" data-act="upload" '+id+'>'+(val?'更換圖片':'上傳圖片')+'</button>'
      +(val?'<button class="btn btn-s btn-d" data-act="clearimg" '+id+'>清除</button>':'')+'</div>';
  if(f.type==='num') return h+'<input type="number" step="0.1" '+id+' value="'+esc(val)+'"/>';
  return h+'<input type="text" '+id+' value="'+esc(val)+'"/>';
}
function renderSection(sid){
  var s=ZHIE_SCHEMA.filter(function(x){return x.id===sid;})[0];
  var h='<h1>'+esc(s.title)+'</h1><div class="sub">改好後按最下方「儲存」,前台重新整理就會看到。</div><div class="card">';
  s.fields.forEach(function(f){
    if(f.type==='list'){
      h+='<label class="l" style="margin-top:18px;font-weight:700;color:var(--navy);font-size:14px;">'+esc(f.label)+'</label>';
      (CUR[f.k]||[]).forEach(function(it,i){
        h+='<div class="item"><div class="h"><b>'+esc(f.itemLabel)+' '+(i+1)+'</b><span>'
          +'<button class="btn btn-s" data-act="up" data-k="'+f.k+'" data-i="'+i+'">↑</button> '
          +'<button class="btn btn-s" data-act="down" data-k="'+f.k+'" data-i="'+i+'">↓</button> '
          +'<button class="btn btn-s btn-d" data-act="del" data-k="'+f.k+'" data-i="'+i+'">刪除</button></span></div>';
        f.fields.forEach(function(sf){h+=fieldHtml(sf,it[sf.k],'data-k="'+f.k+'" data-i="'+i+'" data-sf="'+sf.k+'"');});
        h+='</div>';
      });
      if(!f.max||(CUR[f.k]||[]).length<f.max) h+='<button class="btn btn-s" data-act="add" data-k="'+f.k+'">＋ 新增'+esc(f.itemLabel)+'</button>';
      else h+='<div style="font-size:12px;color:var(--mute);">已達上限 '+f.max+' 筆</div>';
    } else h+=fieldHtml(f,CUR[f.k],'data-k="'+f.k+'"');
  });
  h+='</div><div class="savebar"><button class="btn btn-p" onclick="saveSection(\''+sid+'\')">儲存這一頁</button></div>';
  var keep=window.scrollY;
  $('pane').innerHTML=h;
  window.scrollTo(0,keep);
}
function findField(k){var r=null;ZHIE_SCHEMA.forEach(function(s){s.fields.forEach(function(f){if(f.k===k)r=f;});});return r;}
async function saveSection(sid){
  var s=ZHIE_SCHEMA.filter(function(x){return x.id===sid;})[0];
  var rows=s.fields.map(function(f){return {key:f.k,value:f.type==='list'?JSON.stringify(CUR[f.k]||[]):String(CUR[f.k]==null?'':CUR[f.k])};});
  if(await saveRows(rows)) toast('已儲存!前台重新整理即可看到');
}
// 輸入事件(單行/多行/勾選)
$('pane').addEventListener('input',function(e){
  var el=e.target,k=el.getAttribute('data-k');if(!k)return;
  var v=el.type==='checkbox'?(el.checked?'1':'0'):el.value;
  if(el.hasAttribute('data-i')) CUR[k][+el.getAttribute('data-i')][el.getAttribute('data-sf')]=v; else CUR[k]=v;
});
// 按鈕事件(上傳/清除/新增/刪除/上下移)
$('pane').addEventListener('click',async function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var act=b.getAttribute('data-act'),k=b.getAttribute('data-k'),i=b.hasAttribute('data-i')?+b.getAttribute('data-i'):null,sf=b.getAttribute('data-sf');
  if(act==='upload'){
    var url=await pickAndUpload(k+(i!=null?'_'+i:''));if(!url)return;
    if(i!=null) CUR[k][i][sf]=url; else CUR[k]=url;
    renderSection(CURPAGE.slice(4));
  } else if(act==='clearimg'){
    if(i!=null) CUR[k][i][sf]=''; else CUR[k]='';
    renderSection(CURPAGE.slice(4));
  } else if(act==='add'){
    var f=findField(k),o={};f.fields.forEach(function(x){o[x.k]='';});CUR[k].push(o);renderSection(CURPAGE.slice(4));
  } else if(act==='del'){
    if(!confirm('確定刪除這一筆?(按「儲存這一頁」後才會真的生效)'))return;
    CUR[k].splice(i,1);renderSection(CURPAGE.slice(4));
  } else if(act==='up'&&i>0){var a=CUR[k];var t=a[i];a[i]=a[i-1];a[i-1]=t;renderSection(CURPAGE.slice(4));}
  else if(act==='down'&&i<CUR[k].length-1){var a2=CUR[k];var t2=a2[i];a2[i]=a2[i+1];a2[i+1]=t2;renderSection(CURPAGE.slice(4));}
});

/* ============ 圖片上傳(存到 Storage 的 products 桶/site 資料夾) ============ */
function pickAndUpload(tag){
  return new Promise(function(resolve){
    var inp=document.createElement('input');inp.type='file';inp.accept='image/*';
    inp.onchange=async function(){
      if(!inp.files||!inp.files[0]){resolve(null);return;}
      toast('圖片上傳中…');
      var url=await uploadImage(inp.files[0],tag);
      resolve(url);
    };
    inp.click();
  });
}
async function shrink(file){   // 超過 2000px 的大圖先縮小(省空間、網頁較快);svg/gif 不處理
  if(!/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
  var bmp;try{bmp=await createImageBitmap(file);}catch(e){return file;}
  var max=2000;if(bmp.width<=max&&bmp.height<=max) return file;
  var sc=max/Math.max(bmp.width,bmp.height),c=document.createElement('canvas');
  c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return await new Promise(function(res){c.toBlob(function(b){res(b||file);},file.type,0.9);});
}
async function uploadImage(file,tag){
  var f=await shrink(file);
  var ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
  var path='site/'+String(tag).replace(/[^a-zA-Z0-9_-]/g,'')+'_'+Date.now()+'.'+ext;
  var r=await sb.storage.from('products').upload(path,f,{contentType:file.type,upsert:false});
  if(r.error){toast('上傳失敗:'+r.error.message,true);return null;}
  toast('圖片已上傳(記得按「儲存」)');
  return SB_STORAGE+path;
}

/* ============ 尺寸卡片照片 ============ */
var SIZE_DEFAULT={'2':'2inch.jpg','3.5':'3_5inch.jpg','4.3':'4_3inch.jpg','5':'5inch.jpg','5.7':'5_7inch.jpg','6.86':'6_86inch.jpg','7':'7inch.jpg','8':'8inch.jpg','10.1':'10_1inch.jpg','12.1':'12_1inch.jpg'};
async function renderSizes(){
  $('pane').innerHTML='<h1>各尺寸卡片照片</h1><div class="sub">前台「產品」區每個尺寸卡片上的照片。換好照片後立即生效,不用再按儲存。</div><div class="card" id="sz">載入中…</div>';
  var r=await sb.from('products').select('size_inch');
  var set={};(r.data||[]).forEach(function(p){if(p.size_inch)set[p.size_inch]=1;});
  var sizes=Object.keys(set).sort(function(a,b){return parseFloat(a)-parseFloat(b);});
  var h='';
  sizes.forEach(function(s){
    var u=SIZEIMGS[s]||(SIZE_DEFAULT[s]?SB_STORAGE+SIZE_DEFAULT[s]:'');
    h+='<div class="item"><div class="h"><b>'+esc(s)+' 吋</b></div><div class="imgbox">'+(u?'<img src="'+esc(u)+'"/>':'<span style="color:var(--mute);font-size:13px;">尚無照片</span>')
      +'<button class="btn btn-s" onclick="changeSizeImg(\''+esc(s)+'\')">'+(u?'更換':'上傳')+'照片</button>'
      +(SIZEIMGS[s]?'<button class="btn btn-s btn-d" onclick="resetSizeImg(\''+esc(s)+'\')">還原預設</button>':'')+'</div></div>';
  });
  $('sz').innerHTML=h||'目前沒有產品資料';
}
async function changeSizeImg(s){
  var u=await pickAndUpload('size_'+s);if(!u)return;
  SIZEIMGS[s]=u;
  if(await saveRows([{key:'size_imgs',value:JSON.stringify(SIZEIMGS)}])){toast('已更新');renderSizes();}
}
async function resetSizeImg(s){
  delete SIZEIMGS[s];
  if(await saveRows([{key:'size_imgs',value:JSON.stringify(SIZEIMGS)}])){toast('已還原');renderSizes();}
}

/* ============ 產品 ============ */
var PFIELDS=[
 ['model_name','型號(必填)'],['size_inch','尺寸分組(前台卡片用,例:5、7、10.1)'],['panel_size','Panel Size(例:5.0)'],
 ['resolution','解析度'],['tp','觸控(例:CTP,沒有填 NA)'],['gray_scale','灰階/面板類型'],
 ['outline_mm','外型尺寸 Outline(mm)'],['active_area_mm','可視區 Active Area(mm)'],['brightness','亮度(nits,只填數字)'],
 ['backlight_condition','背光條件'],['driver_ic','Driver IC'],['interface','介面 Interface'],
 ['pin_out','Pin Out'],['op_temp','操作溫度(例:-20~70)'],['note','備註']
];
var PRODS=[],PQ='';
async function renderProducts(){
  $('pane').innerHTML='<h1>產品上下架・修改</h1><div class="sub">「上架中」才會出現在前台;不要顯示就改成「下架」(資料保留,可隨時再上架)。</div>'
   +'<div class="card"><div style="display:flex;gap:8px;flex-wrap:wrap;"><input type="text" id="pq" placeholder="搜尋型號/尺寸/分類" style="flex:1;min-width:160px;" oninput="PQ=this.value;drawProducts()"/><button class="btn btn-p" onclick="editProduct(null)">＋ 新增產品</button></div>'
   +'<div class="tbl-wrap" id="plist" style="margin-top:12px;">載入中…</div></div>';
  var all=[],from=0;
  for(;;){var r=await sb.from('products').select('*').order('size_inch').order('model_name').range(from,from+999);
    if(r.error){$('plist').textContent='載入失敗:'+r.error.message;return;}
    all=all.concat(r.data);if(r.data.length<1000)break;from+=1000;}
  PRODS=all;drawProducts();
}
function drawProducts(){
  var q=PQ.toLowerCase();
  var list=PRODS.filter(function(p){return !q||[p.model_name,p.size_inch,p.category,p.resolution].join(' ').toLowerCase().indexOf(q)>=0;});
  var h='<table><tr><th>型號</th><th>尺寸</th><th>分類</th><th>狀態</th><th></th></tr>';
  list.slice(0,300).forEach(function(p){
    h+='<tr><td><b>'+esc(p.model_name)+'</b></td><td>'+esc(p.size_inch)+'</td><td>'+esc(p.category)+'</td><td><span class="badge '+(p.status==='active'?'':'off')+'">'+(p.status==='active'?'上架中':'下架')+'</span></td>'
     +'<td style="white-space:nowrap;"><button class="btn btn-s" onclick="editProduct(\''+p.id+'\')">編輯</button> <button class="btn btn-s" onclick="toggleProduct(\''+p.id+'\')">'+(p.status==='active'?'下架':'上架')+'</button></td></tr>';
  });
  h+='</table>'+(list.length>300?'<div class="sub" style="margin-top:8px;">只顯示前 300 筆,請用搜尋縮小範圍(共 '+list.length+' 筆)</div>':'<div class="sub" style="margin-top:8px;">共 '+list.length+' 筆</div>');
  $('plist').innerHTML=h;
}
async function toggleProduct(id){
  var p=PRODS.filter(function(x){return x.id===id;})[0];var ns=p.status==='active'?'inactive':'active';
  var r=await sb.from('products').update({status:ns,updated_at:new Date().toISOString()}).eq('id',id);
  if(r.error){toast('失敗:'+r.error.message,true);return;}
  p.status=ns;drawProducts();toast(ns==='active'?'已上架':'已下架');
}
var EDITP=null;
function editProduct(id){
  EDITP=id?JSON.parse(JSON.stringify(PRODS.filter(function(x){return x.id===id;})[0])):{status:'active',category:((CUR.prod_cats||[])[0]||{}).value||'',sort_order:0};
  var cats=(CUR.prod_cats||[]).map(function(c){return c.value;});
  if(EDITP.category&&cats.indexOf(EDITP.category)<0) cats.push(EDITP.category);
  var h='<h1>'+(id?'編輯產品':'新增產品')+'</h1><div class="row2">';
  h+='<div><label class="l">產品分類</label><select data-pf="category">'+cats.map(function(c){return '<option value="'+esc(c)+'"'+(c===EDITP.category?' selected':'')+'>'+esc(c)+'</option>';}).join('')+'</select></div>';
  h+='<div><label class="l">狀態</label><select data-pf="status"><option value="active"'+(EDITP.status==='active'?' selected':'')+'>上架中(前台顯示)</option><option value="inactive"'+(EDITP.status!=='active'?' selected':'')+'>下架(前台不顯示)</option></select></div>';
  PFIELDS.forEach(function(f){h+='<div><label class="l">'+esc(f[1])+'</label><input type="text" data-pf="'+f[0]+'" value="'+esc(EDITP[f[0]])+'"/></div>';});
  h+='</div><label class="l">產品圖片(選填;沒設定就用該尺寸的卡片照片)</label><div class="imgbox" id="pimg"></div>';
  h+='<div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;"><button class="btn btn-p" onclick="saveProduct()">儲存</button><button class="btn" onclick="closeP()">取消</button>'
    +(id?'<button class="btn btn-d" style="margin-left:auto;" onclick="deleteProduct()">刪除這筆產品</button>':'')+'</div>';
  $('pmodal-in').innerHTML=h;drawPimg();$('pmodal').classList.add('on');
}
function drawPimg(){
  $('pimg').innerHTML=(EDITP.image_url?'<img src="'+esc(EDITP.image_url)+'"/>':'<span style="color:var(--mute);font-size:13px;">未設定</span>')
   +'<button class="btn btn-s" onclick="pickPimg()">'+(EDITP.image_url?'更換':'上傳')+'圖片</button>'+(EDITP.image_url?'<button class="btn btn-s btn-d" onclick="EDITP.image_url=null;drawPimg()">清除</button>':'');
}
async function pickPimg(){var u=await pickAndUpload('product');if(u){EDITP.image_url=u;drawPimg();}}
function closeP(){$('pmodal').classList.remove('on');}
$('pmodal').addEventListener('input',function(e){var k=e.target.getAttribute('data-pf');if(k)EDITP[k]=e.target.value;});
async function saveProduct(){
  if(!String(EDITP.model_name||'').trim()){toast('請填型號',true);return;}
  var row={};PFIELDS.forEach(function(f){row[f[0]]=EDITP[f[0]]==null?'':String(EDITP[f[0]]).trim();});
  row.category=EDITP.category;row.status=EDITP.status;row.image_url=EDITP.image_url||null;row.updated_at=new Date().toISOString();
  var r=EDITP.id?await sb.from('products').update(row).eq('id',EDITP.id):await sb.from('products').insert(row);
  if(r.error){toast('儲存失敗:'+r.error.message,true);return;}
  toast('已儲存');closeP();renderProducts();
}
async function deleteProduct(){
  if(!confirm('確定要永久刪除「'+EDITP.model_name+'」?刪除後無法復原。(只是暫時不顯示請用「下架」)'))return;
  var r=await sb.from('products').delete().eq('id',EDITP.id);
  if(r.error){toast('刪除失敗:'+r.error.message,true);return;}
  toast('已刪除');closeP();renderProducts();
}

/* ============ 詢價收件匣 ============ */
async function renderInq(){
  $('pane').innerHTML='<h1>詢價收件匣</h1><div class="sub">客人在前台按「送出詢價」的內容都會收在這裡。</div><div class="card" id="iq">載入中…</div>';
  var r=await sb.from('inquiries').select('*').order('created_at',{ascending:false}).limit(200);
  if(r.error){$('iq').innerHTML='<div class="warn">還沒啟用:詢價資料表尚未建立(需先執行 SQL 01)。<br/>'+esc(r.error.message)+'</div>';return;}
  if(!r.data.length){$('iq').textContent='目前沒有詢價';return;}
  var h='<div class="tbl-wrap"><table><tr><th>時間</th><th>公司</th><th>Email</th><th>需求</th><th></th></tr>';
  r.data.forEach(function(x){
    var d=new Date(x.created_at);
    h+='<tr style="'+(x.status==='new'?'background:#f3f8ff;':'')+'"><td style="white-space:nowrap;">'+d.toLocaleString('zh-TW')+'</td><td>'+esc(x.company)+'</td><td><a href="mailto:'+esc(x.email)+'">'+esc(x.email)+'</a></td><td style="white-space:pre-wrap;">'+esc(x.message)+'</td>'
     +'<td style="white-space:nowrap;"><button class="btn btn-s" onclick="inqDone(\''+x.id+'\',\''+(x.status==='new'?'done':'new')+'\')">'+(x.status==='new'?'標記已處理':'改回未處理')+'</button> <button class="btn btn-s btn-d" onclick="inqDel(\''+x.id+'\')">刪除</button></td></tr>';
  });
  $('iq').innerHTML=h+'</table></div>';
}
async function inqDone(id,st){var r=await sb.from('inquiries').update({status:st}).eq('id',id);if(r.error)toast(r.error.message,true);else renderInq();}
async function inqDel(id){if(!confirm('確定刪除這筆詢價?'))return;var r=await sb.from('inquiries').delete().eq('id',id);if(r.error)toast(r.error.message,true);else renderInq();}
</script>
