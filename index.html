<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>致一科技 ZHIE Technology — 專業顯示模組</title>
<link rel="icon" type="image/png" href="logo.png"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="site-schema.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Noto Sans TC','Inter',system-ui,sans-serif;background:#f4f6f9;color:#1c2333;font-size:15px;line-height:1.7;}

:root{
  --blue:#1a56db;--blue-hover:#1348c0;--blue-light:#e8effd;--navy:#0f2057;
  --gray-50:#f4f6f9;--gray-100:#edf0f5;--gray-200:#dde2ed;--gray-300:#c4cce0;
  --gray-500:#6b7a99;--gray-700:#3d4d6b;--gray-900:#1c2333;--white:#fff;
  --shadow-sm:0 1px 4px rgba(15,32,87,0.07);
  --shadow:0 4px 16px rgba(15,32,87,0.09);
  --shadow-lg:0 12px 40px rgba(15,32,87,0.13);
  --radius:8px;--radius-lg:14px;
}

/* NAV */
.nav{background:var(--white);border-bottom:1px solid var(--gray-200);position:sticky;top:0;z-index:100;}
.nav-inner{max-width:1160px;margin:0 auto;padding:0 40px;height:64px;display:flex;align-items:center;justify-content:space-between;}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.nav-logo img{height:44px;width:auto;}
.nav-logo-text{display:flex;flex-direction:column;line-height:1.2;}
.nav-logo-text-zh{font-size:16px;font-weight:700;color:var(--navy);letter-spacing:0.3px;}
.nav-logo-text-en{font-size:12px;font-weight:500;color:var(--gray-500);letter-spacing:0.3px;}
.nav-links{display:flex;align-items:center;gap:2px;}
.nav-link{padding:7px 14px;font-size:14px;font-weight:500;color:var(--gray-700);text-decoration:none;border-radius:var(--radius);transition:all 0.15s;}
.nav-link:hover{background:var(--gray-100);color:var(--navy);}
.nav-cta{padding:8px 18px;background:var(--blue);color:#fff;border-radius:var(--radius);font-size:14px;font-weight:500;text-decoration:none;transition:background 0.15s;margin-left:6px;}
.nav-cta:hover{background:var(--blue-hover);}
.nav-toggle{display:none;flex-direction:column;justify-content:center;gap:4px;width:38px;height:38px;background:none;border:none;cursor:pointer;padding:6px;flex-shrink:0;}
.nav-toggle span{display:block;width:100%;height:2px;background:var(--navy);border-radius:2px;}

/* HERO */
.hero{background:linear-gradient(135deg,#e8effd 0%,#f4f6f9 55%,#edf2fc 100%);border-bottom:1px solid var(--gray-200);padding:60px 0 56px;position:relative;overflow:hidden;}
.hero::after{content:'';position:absolute;bottom:-100px;right:-100px;width:400px;height:400px;background:radial-gradient(circle,rgba(26,86,219,0.07) 0%,transparent 70%);border-radius:50%;}
.hero-inner{max-width:1160px;margin:0 auto;padding:0 40px;display:flex;align-items:center;gap:64px;}
.hero-text{flex:1;}
.hero-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--blue);letter-spacing:0.04em;background:var(--blue-light);padding:4px 12px;border-radius:20px;margin-bottom:14px;}
.hero-title{font-size:clamp(20px,2.5vw,28px);font-weight:700;color:var(--navy);line-height:1.3;margin-bottom:12px;letter-spacing:-0.01em;}
.hero-title em{font-style:normal;color:var(--blue);}
.hero-desc{font-size:15px;color:var(--gray-500);line-height:1.85;max-width:500px;margin-bottom:32px;}
.hero-btns{display:flex;gap:12px;flex-wrap:wrap;}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:var(--radius);font-size:14px;font-weight:500;text-decoration:none;border:none;cursor:pointer;transition:all 0.15s;}
.btn-primary{background:var(--blue);color:#fff;}
.btn-primary:hover{background:var(--blue-hover);transform:translateY(-1px);}
.btn-outline{background:transparent;color:var(--navy);border:1.5px solid var(--gray-300);}
.btn-outline:hover{border-color:var(--blue);background:var(--blue-light);}
.hero-stats{display:flex;gap:32px;margin-top:28px;flex-wrap:wrap;padding-top:24px;border-top:1px solid var(--gray-200);}
.hero-stat-num{font-size:22px;font-weight:700;color:var(--navy);line-height:1;}
.hero-stat-label{font-size:13px;color:var(--gray-500);margin-top:3px;}
.hero-visual{flex:0 0 560px;}
.hero-img{overflow:hidden;border-radius:12px;background:var(--gray-100);position:relative;min-height:260px;display:flex;align-items:center;justify-content:center;}
.hero-img img{width:100%;height:auto;display:block;object-fit:contain;opacity:0;transition:opacity 0.25s;}
.hero-img img.loaded{opacity:1;}
.hero-img-ph{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--gray-300);font-size:12px;text-align:center;padding:40px;}
@media(max-width:900px){.hero-inner{flex-direction:column;}.hero-visual{flex:none;width:100%;max-width:480px;}}

/* SECTION */
.section{padding:60px 24px;}
.wrap{max-width:1160px;margin:0 auto;padding:0 40px;}
.section-title{font-size:24px;font-weight:700;color:var(--navy);letter-spacing:-0.01em;line-height:1.3;margin-bottom:10px;}
.section-desc{font-size:15px;color:var(--gray-500);margin-top:8px;max-width:560px;line-height:1.85;}

/* ABOUT */
.about-bg{background:var(--white);border-top:1px solid var(--gray-200);border-bottom:1px solid var(--gray-200);}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:start;}
.about-img-wrap{position:relative;border:1px solid var(--gray-200);border-radius:var(--radius-lg);overflow:hidden;aspect-ratio:4/3;background:var(--gray-100);}

.about-img-wrap img{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:100%;transition:none;user-select:none;}
.about-img-ph{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--gray-300);font-size:12px;text-align:center;padding:40px;height:100%;justify-content:center;}

.about-points{display:flex;flex-direction:column;gap:18px;margin-top:28px;}
.about-pts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px;}
.about-pt{display:flex;gap:14px;}
.about-pt-icon{width:38px;height:38px;border-radius:9px;background:var(--blue-light);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.about-pt-title{font-size:14px;font-weight:600;color:var(--navy);margin-bottom:3px;}
.about-pt-desc{font-size:13px;color:var(--gray-500);line-height:1.7;}
@media(max-width:768px){.about-grid{grid-template-columns:1fr;}}

/* PRODUCTS */
.products-bg{background:var(--gray-50);}
.cat-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:28px;background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:6px;width:fit-content;}
.cat-tab{padding:8px 20px;border-radius:10px;font-size:13px;font-weight:500;border:none;background:transparent;color:var(--gray-700);cursor:pointer;transition:all 0.15s;}
.cat-tab:hover{background:var(--gray-100);}
.cat-tab.active{background:var(--blue);color:#fff;box-shadow:var(--shadow-sm);}

/* 尺寸卡片 */
.size-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;}
.size-card{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius-lg);overflow:hidden;cursor:pointer;transition:all 0.18s;}
.size-card:hover{border-color:var(--blue);box-shadow:var(--shadow);transform:translateY(-2px);}
.size-card-img{aspect-ratio:4/3;overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--gray-200);}
.size-card-img img{width:100%;height:100%;object-fit:contain;padding:10px;transition:transform 0.3s;}
.size-card:hover .size-card-img img{transform:scale(1.04);}
.size-card-img-ph{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--gray-300);font-size:12px;}
.size-card-body{padding:14px 16px;}
.size-card-inch{font-size:20px;font-weight:700;color:var(--navy);margin-bottom:3px;}
.size-card-count{font-size:12px;color:var(--gray-500);}
.size-card-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px;}
.size-tag{font-size:11px;padding:2px 8px;border-radius:4px;background:var(--gray-100);color:var(--gray-700);border:1px solid var(--gray-200);}
.size-tag.blue{background:var(--blue-light);color:var(--blue);border-color:transparent;}

/* 產品列表（點進尺寸後） */
.product-list-header{display:flex;align-items:center;gap:12px;margin-bottom:24px;}
.back-btn{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--blue);background:none;border:none;cursor:pointer;padding:0;font-weight:500;}
.back-btn:hover{text-decoration:underline;}
.product-list-title{font-size:22px;font-weight:700;color:var(--navy);}
.product-list-count{font-size:13px;color:var(--gray-500);}
.prod-table-wrap{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius-lg);overflow-x:auto;-webkit-overflow-scrolling:touch;}
.prod-table{width:100%;border-collapse:collapse;font-size:13px;}
.prod-table th{background:var(--gray-50);padding:10px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--gray-500);letter-spacing:0.05em;text-transform:uppercase;border-bottom:1px solid var(--gray-200);white-space:nowrap;}
.prod-table td{padding:12px 14px;border-bottom:1px solid var(--gray-100);color:var(--gray-900);vertical-align:middle;}
.prod-table tr:last-child td{border-bottom:none;}
.prod-table tr:hover td{background:var(--gray-50);cursor:pointer;}
.prod-model{font-family:'Inter',monospace;font-weight:700;color:var(--blue);font-size:12px;}
.tp-badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:4px;background:var(--blue-light);color:var(--blue);font-weight:500;}
.tp-none{background:var(--gray-100);color:var(--gray-500);}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(15,32,87,0.4);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal-box{background:var(--white);border-radius:var(--radius-lg);width:100%;max-width:680px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
.modal-top{display:grid;grid-template-columns:220px 1fr;border-bottom:1px solid var(--gray-200);}
.modal-img-side{background:var(--gray-100);display:flex;align-items:center;justify-content:center;padding:20px;border-right:1px solid var(--gray-200);}
.modal-img-side img{max-width:180px;max-height:180px;object-fit:contain;}
.modal-img-ph{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--gray-300);font-size:11px;text-align:center;}
.modal-info{padding:20px 22px;}
.modal-model{font-size:12px;font-weight:700;color:var(--blue);font-family:monospace;margin-bottom:5px;}
.modal-title{font-size:18px;font-weight:700;color:var(--navy);margin-bottom:12px;}
.modal-body{padding:20px 22px;}
.spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.spec-item{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:var(--radius);padding:10px 12px;}
.spec-label{font-size:10px;color:var(--gray-500);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:3px;}
.spec-val{font-size:13px;font-weight:600;color:var(--navy);}
.modal-actions{padding:16px 22px;border-top:1px solid var(--gray-200);display:flex;gap:10px;}
.modal-close-btn{position:absolute;top:16px;right:16px;background:var(--gray-100);border:none;border-radius:var(--radius);width:32px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--gray-700);}
.modal-close-btn:hover{background:var(--gray-200);}

/* SOLUTIONS */
.sol-bg{background:var(--white);border-top:1px solid var(--gray-200);border-bottom:1px solid var(--gray-200);}
.sol-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.sol-card{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:24px;}
.sol-icon{width:44px;height:44px;border-radius:10px;background:var(--blue-light);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:14px;}
.sol-title{font-size:15px;font-weight:600;color:var(--navy);margin-bottom:8px;}
.sol-desc{font-size:13px;color:var(--gray-500);line-height:1.8;}
.sol-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px;}
.sol-tag{font-size:11px;padding:3px 9px;border-radius:4px;background:var(--blue-light);color:var(--blue);}
@media(max-width:768px){.sol-grid{grid-template-columns:1fr;}}

/* GALLERY 公司環境 */
.gal-bg{background:var(--gray-50);}
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-top:28px;}
.gal-item{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius-lg);overflow:hidden;}
.gal-item img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;}
.gal-cap{padding:10px 14px;font-size:13px;color:var(--gray-700);}
.map-box{margin-top:18px;border-radius:var(--radius);overflow:hidden;border:1px solid rgba(255,255,255,0.15);}
.map-box iframe{width:100%;height:220px;border:0;display:block;}
.hp-field{position:absolute;left:-9999px;opacity:0;height:0;width:0;}

/* CONTACT */
.contact-bg{background:var(--navy);}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:start;}
.contact-hl{font-size:11px;font-weight:600;color:rgba(255,255,255,0.45);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:12px;}
.contact-title{font-size:20px;font-weight:700;color:#fff;margin-bottom:10px;line-height:1.3;}
.contact-desc{font-size:14px;color:rgba(255,255,255,0.55);line-height:1.85;margin-bottom:24px;}
.contact-rows{display:flex;flex-direction:column;gap:12px;}
.contact-row{display:flex;gap:12px;align-items:center;}
.c-icon{width:36px;height:36px;border-radius:8px;background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.6);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px;}
.c-text{font-size:13px;color:rgba(255,255,255,0.75);}
.contact-form-box{background:var(--white);border-radius:var(--radius-lg);padding:28px;}
.form-title{font-size:16px;font-weight:600;color:var(--navy);margin-bottom:18px;}
.form-group{margin-bottom:12px;}
.form-label{font-size:11px;font-weight:500;color:var(--gray-500);margin-bottom:5px;display:block;letter-spacing:0.04em;}
.form-input{width:100%;padding:9px 12px;border:1.5px solid var(--gray-200);border-radius:var(--radius);font-size:13px;color:var(--gray-900);background:var(--gray-50);outline:none;transition:border-color 0.15s;font-family:inherit;}
.form-input:focus{border-color:var(--blue);background:var(--white);}
.form-input::placeholder{color:var(--gray-300);}
textarea.form-input{resize:none;height:88px;line-height:1.6;}
@media(max-width:768px){.contact-grid{grid-template-columns:1fr;}}

/* FOOTER */
.footer{background:#0a1840;padding:28px 24px;border-top:1px solid rgba(255,255,255,0.06);}
.footer-inner{max-width:1160px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
.footer-copy{font-size:12px;color:rgba(255,255,255,0.35);}
.footer-links{display:flex;gap:20px;}
.footer-link{font-size:12px;color:rgba(255,255,255,0.35);text-decoration:none;transition:color 0.15s;}
.footer-link:hover{color:rgba(255,255,255,0.7);}

/* UTILS */
.spinner{width:20px;height:20px;border:2px solid var(--gray-200);border-top-color:var(--blue);border-radius:50%;animation:spin 0.7s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty{text-align:center;padding:52px 0;color:var(--gray-500);}

/* MOBILE */
@media(max-width:640px){
  .nav-inner{padding:0 16px;}
  .nav-toggle{display:flex;}
  .nav-links{
    position:absolute;top:64px;left:0;right:0;
    background:var(--white);
    border-bottom:1px solid var(--gray-200);
    box-shadow:var(--shadow);
    flex-direction:column;align-items:stretch;gap:2px;
    padding:8px 16px 16px;
    display:none;
  }
  .nav-links.open{display:flex;}
  .nav-link{padding:12px 10px;width:100%;border-radius:6px;}
  .nav-cta{margin:8px 0 0;text-align:center;justify-content:center;width:100%;}
  .nav-logo-text-en{display:none;}

  .wrap{padding:0 16px;}
  .section{padding:40px 0;}
  .hero-inner{padding:0 16px;}
  .hero-title{font-size:22px;}

  .about-pts-grid{grid-template-columns:1fr;gap:14px;}

  .size-grid{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;}
  .size-card-body{padding:10px 12px;}
  .size-card-inch{font-size:16px;}
  .size-card-count{font-size:11px;}
  .size-tag{font-size:10px;padding:2px 6px;}

  .modal-top{grid-template-columns:1fr;}
  .modal-img-side{border-right:none;border-bottom:1px solid var(--gray-200);padding:16px;}
  .spec-grid{grid-template-columns:1fr;}

  .footer-inner{flex-direction:column;text-align:center;}

  .prod-table{font-size:12px;min-width:640px;}
  .prod-table th,.prod-table td{padding:9px 8px;}
}
</style>
</head>
<body>

<!-- 說明:頁面上所有文字/圖片都由後台設定(site_settings)控制,預設值在 site-schema.js。
     data-k="key" = 這裡的文字會被後台設定取代。要新增可改項目,請先改 site-schema.js。 -->

<!-- NAV -->
<nav class="nav">
  <div class="nav-inner">
    <a href="#" class="nav-logo">
      <img src="logo.png" id="logo-img" alt="ZHIE"/>
      <div class="nav-logo-text">
        <span class="nav-logo-text-zh" data-k="company_zh"></span>
        <span class="nav-logo-text-en" data-k="company_en"></span>
      </div>
    </a>
    <div class="nav-links" id="navLinks">
      <a href="#about" class="nav-link" data-k="nav_about"></a>
      <a href="#products" class="nav-link" data-k="nav_products"></a>
      <a href="#solutions" class="nav-link" data-k="nav_solutions"></a>
      <a href="#gallery" class="nav-link" id="nav-gallery" style="display:none;" data-k="nav_gallery"></a>
      <a href="#contact" class="nav-cta" data-k="nav_contact"></a>
    </div>
    <button class="nav-toggle" id="navToggle" aria-label="開啟選單" onclick="toggleNav()">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<!-- HERO -->
<section class="hero">
  <div class="hero-inner">
    <div class="hero-text">
      <div class="hero-badge" data-k="hero_badge"></div>
      <h1 class="hero-title"><span data-k="hero_title_1"></span><br/><em data-k="hero_title_2"></em></h1>
      <p class="hero-desc" data-k="hero_desc"></p>
      <div class="hero-btns">
        <a href="#products" class="btn btn-primary" data-k="hero_btn1"></a>
        <a href="#contact" class="btn btn-outline" data-k="hero_btn2"></a>
      </div>
      <div class="hero-stats" id="hero-stats"></div>
    </div>
    <div class="hero-visual">
      <div class="hero-img">
        <div class="hero-img-ph" id="hero-img-ph">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none"><rect x="4" y="8" width="40" height="26" rx="3" stroke="#c4cce0" stroke-width="1.5" fill="none"/><rect x="8" y="12" width="32" height="18" rx="1.5" fill="#edf0f5"/></svg>
          <span data-k="hero_img_ph"></span>
        </div>
        <img id="hero-img" alt="" style="width:100%;height:100%;object-fit:cover;"/>
      </div>
    </div>
  </div>
</section>

<!-- ABOUT -->
<section class="section about-bg" id="about">
  <div class="wrap">
    <div class="about-grid">
      <div class="about-img-wrap" id="about-img" >
        <div class="about-img-ph" id="about-img-ph">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none"><rect x="4" y="8" width="40" height="26" rx="3" stroke="#c4cce0" stroke-width="1.5" fill="none"/><rect x="8" y="12" width="32" height="18" rx="1.5" fill="#edf0f5"/></svg>
          <span data-k="about_img_ph"></span>
        </div>
      </div>
      <div>
        <h2 class="section-title" id="about-title" data-k="about_title"></h2>
        <p style="font-size:14px;color:var(--gray-500);line-height:1.85;margin-top:10px;" id="about-desc" data-k="about_desc"></p>
        <div class="about-pts-grid" id="about-points"></div>
      </div>
    </div>
  </div>
</section>

<!-- GALLERY 公司環境(沒照片時整區隱藏) -->
<section class="section gal-bg" id="gallery" style="display:none;">
  <div class="wrap">
    <h2 class="section-title" data-k="gallery_title"></h2>
    <p class="section-desc" id="gallery-desc" data-k="gallery_desc"></p>
    <div class="gal-grid" id="gallery-grid"></div>
  </div>
</section>

<!-- PRODUCTS -->
<section class="section products-bg" id="products">
  <div class="wrap">
    <div style="margin-bottom:32px;">
      <h2 class="section-title" data-k="prod_title"></h2>
      <p class="section-desc" data-k="prod_desc"></p>
    </div>
    <div class="cat-tabs" id="cat-tabs"></div>
    <div id="product-area">
      <div style="text-align:center;padding:40px 0;">
        <div class="spinner"></div>
        <div style="margin-top:12px;color:var(--gray-500);font-size:14px;" data-k="txt_loading"></div>
      </div>
    </div>
  </div>
</section>

<!-- SOLUTIONS -->
<section class="section sol-bg" id="solutions">
  <div class="wrap">
    <div style="margin-bottom:36px;">
      <h2 class="section-title" data-k="sol_title"></h2>
      <p class="section-desc" data-k="sol_desc"></p>
    </div>
    <div class="sol-grid" id="sol-grid"></div>
  </div>
</section>

<!-- CONTACT -->
<section class="section contact-bg" id="contact">
  <div class="wrap">
    <div class="contact-grid">
      <div>
        <h2 class="contact-title" data-k="contact_title"></h2>
        <p class="contact-desc" data-k="contact_desc"></p>
        <div class="contact-rows" id="contact-rows"></div>
        <div class="map-box" id="map-box" style="display:none;"></div>
      </div>
      <div class="contact-form-box">
        <div class="form-title" data-k="form_title"></div>
        <div class="form-group"><label class="form-label" data-k="form_company"></label><input class="form-input" id="f-company" data-ph="form_company_ph"/></div>
        <div class="form-group"><label class="form-label" data-k="form_email"></label><input class="form-input" type="email" id="f-email" data-ph="form_email_ph"/></div>
        <div class="form-group"><label class="form-label" data-k="form_msg"></label><textarea class="form-input" id="f-msg" data-ph="form_msg_ph"></textarea></div>
        <input class="hp-field" type="text" id="f-hp" tabindex="-1" autocomplete="off" aria-hidden="true"/>
        <button class="btn btn-primary" id="f-btn" style="width:100%;justify-content:center;" onclick="submitForm()" data-k="form_btn"></button>
        <div id="f-result" style="display:none;margin-top:12px;text-align:center;font-size:13px;color:var(--blue);" data-k="form_ok"></div>
        <div id="f-error" style="display:none;margin-top:12px;text-align:center;font-size:13px;color:#c0392b;" data-k="form_fail"></div>
      </div>
    </div>
  </div>
</section>

<!-- FOOTER -->
<footer class="footer">
  <div class="footer-inner">
    <div class="footer-copy" data-k="footer_copy"></div>
    <div class="footer-links">
      <a href="#about" class="footer-link" data-k="footer_about"></a>
      <a href="#products" class="footer-link" data-k="footer_products"></a>
      <a href="#contact" class="footer-link" data-k="footer_contact"></a>
    </div>
  </div>
</footer>

<!-- MODAL -->
<div id="modal" style="display:none;" class="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal-box" style="position:relative;">
    <button class="modal-close-btn" onclick="closeModal()">✕</button>
    <div class="modal-top">
      <div class="modal-img-side" id="m-img"></div>
      <div class="modal-info">
        <div class="modal-model" id="m-model"></div>
        <div class="modal-title" id="m-title"></div>
        <div id="m-tags"></div>
      </div>
    </div>
    <div class="modal-body">
      <div class="spec-grid" id="m-specs"></div>
    </div>
    <div class="modal-actions">
      <a href="#contact" class="btn btn-primary" onclick="closeModal()" style="flex:1;justify-content:center;" data-k="modal_btn_inquiry"></a>
      <button class="btn btn-outline" onclick="closeModal()" style="flex:1;justify-content:center;" data-k="modal_btn_close"></button>
    </div>
  </div>
</div>

<script>
const SB_URL='https://zyzmadwlvlgoamppaosg.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5em1hZHdsdmxnb2FtcHBhb3NnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NjI4NjYsImV4cCI6MjA5NjEzODg2Nn0.fyzo1dhruC3PB3ioSL64c8GLLrK7hcR5updxgrmiBnI';
const SB_STORAGE = SB_URL+'/storage/v1/object/public/products/';
const sb=supabase.createClient(SB_URL,SB_KEY);

// 各尺寸預設照片(後台「尺寸照片」有設定就以後台為準,值為完整網址)
const SIZE_IMGS_DEFAULT={
  '1':'','2':'2inch.jpg','3.5':'3_5inch.jpg','4.3':'4_3inch.jpg','5':'5inch.jpg','5.7':'5_7inch.jpg',
  '6.86':'6_86inch.jpg','7':'7inch.jpg','8':'8inch.jpg','10.1':'10_1inch.jpg','12.1':'12_1inch.jpg','15.6':'','高亮':''
};
var SIZE_IMGS_OVERRIDE={};
function sizeImgUrl(size){
  var o=SIZE_IMGS_OVERRIDE[size];
  if(o) return o;
  var f=SIZE_IMGS_DEFAULT[size]||'';
  return f?SB_STORAGE+f:'';
}

var CFG=zhieMerge({});   // 網站設定(預設值 + 後台資料)
function T(k){return CFG[k]==null?'':CFG[k];}

var allProducts=[];
var currentCat='';
var currentView='sizes'; // 'sizes' or 'products'
var currentSize='';

function noImgSvg(sz){return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 40 40" fill="none"><rect x="3" y="7" width="34" height="22" rx="2.5" stroke="#c4cce0" stroke-width="1.5" fill="none"/><rect x="7" y="11" width="26" height="14" rx="1.5" fill="#edf0f5"/></svg>';}

async function loadProducts(){
  var {data,error}=await sb.from('products').select('*').eq('status','active').order('size_inch').order('model_name');
  if(error||!data){
    document.getElementById('product-area').innerHTML='<div class="empty">'+esc(T('txt_load_fail'))+'</div>';
    return;
  }
  allProducts=data;
  renderSizes();
}

function renderCatTabs(){
  var h='<button class="cat-tab'+(currentCat===''?' active':'')+'" onclick="filterCat(\'\')">'+esc(T('prod_cat_all'))+'</button>';
  (T('prod_cats')||[]).forEach(function(c,i){
    h+='<button class="cat-tab'+(currentCat===c.value?' active':'')+'" onclick="filterCat('+i+')">'+esc(c.name)+'</button>';
  });
  document.getElementById('cat-tabs').innerHTML=h;
}

function filterCat(i){
  currentCat=(i===''||i==null)?'':(T('prod_cats')[i]||{}).value||'';
  currentView='sizes';
  currentSize='';
  renderCatTabs();
  renderSizes();
}

function renderSizes(){
  var filtered=allProducts.filter(function(p){return !currentCat||p.category===currentCat;});
  var sizeMap={};
  filtered.forEach(function(p){
    var s=p.size_inch||'其他';
    if(!sizeMap[s]) sizeMap[s]={size:s,products:[],interfaces:new Set(),tps:new Set()};
    sizeMap[s].products.push(p);
    if(p.interface) p.interface.split('/').forEach(function(i){sizeMap[s].interfaces.add(i.trim());});
    if(p.tp&&p.tp!=='NA') sizeMap[s].tps.add(p.tp);
  });
  var sizes=Object.values(sizeMap).sort(function(a,b){return parseFloat(a.size)-parseFloat(b.size);});
  if(!sizes.length){
    document.getElementById('product-area').innerHTML='<div class="empty">'+esc(T('txt_empty'))+'</div>';
    return;
  }
  var html='<div class="size-grid">';
  sizes.forEach(function(sg){
    var imgFile=sizeImgUrl(sg.size);
    var imgHtml=imgFile
      ?'<img src="'+esc(imgFile)+'" alt="'+esc(sg.size)+esc(T('txt_inch'))+'" loading="lazy"/>'
      :'<div class="size-card-img-ph">'+noImgSvg(40)+'<span style="font-size:11px;color:#c4cce0;">'+esc(T('txt_no_img'))+'</span></div>';
    var tags='';
    [...sg.tps].slice(0,2).forEach(function(t){tags+='<span class="size-tag blue">'+esc(t)+'</span>';});
    [...sg.interfaces].slice(0,2).forEach(function(i){tags+='<span class="size-tag">'+esc(i)+'</span>';});
    html+='<div class="size-card" onclick="showProducts(\''+esc(sg.size)+'\')">'
      +'<div class="size-card-img">'+imgHtml+'</div>'
      +'<div class="size-card-body">'
      +'<div class="size-card-inch">'+esc(sg.size)+' '+esc(T('txt_inch'))+'</div>'
      +'<div class="size-card-count">'+sg.products.length+' '+esc(T('txt_models'))+'</div>'
      +'<div class="size-card-tags">'+tags+'</div>'
      +'</div></div>';
  });
  html+='</div>';
  document.getElementById('product-area').innerHTML=html;
  currentView='sizes';
}

function showProducts(size){
  currentSize=size;
  currentView='products';
  var filtered=allProducts.filter(function(p){
    return p.size_inch===size&&(!currentCat||p.category===currentCat);
  });
  var imgFile=sizeImgUrl(size);
  var imgHtml=imgFile
    ?'<img src="'+esc(imgFile)+'" alt="'+esc(size)+esc(T('txt_inch'))+'" style="width:60px;height:44px;object-fit:cover;border-radius:6px;margin-right:8px;vertical-align:middle;"/>'
    :'';
  var html='<div class="product-list-header">'
    +'<button class="back-btn" onclick="renderSizes()">'+esc(T('txt_back'))+'</button>'
    +'<span style="color:var(--gray-300);">|</span>'
    +imgHtml
    +'<span class="product-list-title">'+esc(size)+' '+esc(T('txt_inch'))+'</span>'
    +'<span class="product-list-count">（'+filtered.length+' '+esc(T('txt_count_unit'))+'）</span>'
    +'</div>'
    +'<div class="prod-table-wrap">'
    +'<table class="prod-table">'
    +'<thead><tr>'
    +'<th>'+esc(T('th_model'))+'</th><th>'+esc(T('th_resolution'))+'</th><th>'+esc(T('th_tp'))+'</th><th>'+esc(T('th_brightness'))+'</th><th>'+esc(T('th_interface'))+'</th><th>'+esc(T('th_temp'))+'</th><th></th>'
    +'</tr></thead><tbody>';
  filtered.forEach(function(p){
    var tpBadge=p.tp&&p.tp!=='NA'
      ?'<span class="tp-badge">'+esc(p.tp)+'</span>'
      :'<span class="tp-badge tp-none">'+esc(T('txt_tp_none'))+'</span>';
    html+='<tr onclick="openModal(\''+p.id+'\')">'
      +'<td><span class="prod-model">'+esc(p.model_name)+'</span></td>'
      +'<td>'+esc(p.resolution||'—')+'</td>'
      +'<td>'+tpBadge+'</td>'
      +'<td>'+(p.brightness?esc(p.brightness)+' nits':'—')+'</td>'
      +'<td style="font-size:12px;">'+esc(p.interface||'—')+'</td>'
      +'<td style="font-size:12px;">'+esc(p.op_temp||'—')+'°C</td>'
      +'<td style="color:var(--blue);font-size:12px;">'+esc(T('txt_detail'))+'</td>'
      +'</tr>';
  });
  html+='</tbody></table></div>';
  document.getElementById('product-area').innerHTML=html;
}

function openModal(id){
  var p=allProducts.find(function(x){return x.id===id;});
  if(!p) return;
  var imgFile=p.image_url||sizeImgUrl(p.size_inch);
  document.getElementById('m-img').innerHTML=imgFile
    ?'<img src="'+esc(imgFile)+'" alt="'+esc(p.model_name)+'" style="max-width:160px;max-height:160px;object-fit:contain;"/>'
    :'<div class="modal-img-ph">'+noImgSvg(48)+'<span>'+esc(T('txt_no_img'))+'</span></div>';
  document.getElementById('m-model').textContent=p.model_name;
  document.getElementById('m-title').textContent=(p.panel_size?p.panel_size+'"':p.size_inch+'"')+' '+(p.category||'TFT彩色')+' '+T('modal_suffix');
  document.getElementById('m-tags').innerHTML=p.tp&&p.tp!=='NA'?'<span class="tp-badge" style="margin-top:8px;display:inline-block;">'+esc(p.tp)+'</span>':'';
  var specs=[
    [T('sp_panel'),p.panel_size?p.panel_size+'"':null],
    [T('sp_resolution'),p.resolution],
    [T('sp_gray'),p.gray_scale],
    [T('sp_outline'),p.outline_mm?p.outline_mm+' mm':null],
    [T('sp_active'),p.active_area_mm?p.active_area_mm+' mm':null],
    [T('sp_brightness'),p.brightness?p.brightness+' nits':null],
    [T('sp_backlight'),p.backlight_condition],
    [T('sp_driver'),p.driver_ic],
    [T('sp_interface'),p.interface],
    [T('sp_pin'),p.pin_out],
    [T('sp_temp'),p.op_temp?p.op_temp+' °C':null],
    [T('sp_note'),p.note||null],
  ];
  document.getElementById('m-specs').innerHTML=specs.filter(function(s){return s[1];}).map(function(s){
    return '<div class="spec-item"><div class="spec-label">'+esc(s[0])+'</div><div class="spec-val">'+esc(s[1])+'</div></div>';
  }).join('');
  document.getElementById('modal').style.display='flex';
  document.body.style.overflow='hidden';
}

function closeModal(){
  document.getElementById('modal').style.display='none';
  document.body.style.overflow='';
}

// 詢價:寫入資料庫 inquiries 表(後台「詢價收件」可看),訪客只能新增、不能讀取
var _sending=false;
async function submitForm(){
  if(_sending) return;
  var email=document.getElementById('f-email').value.trim();
  document.getElementById('f-result').style.display='none';
  document.getElementById('f-error').style.display='none';
  if(!email){alert(T('form_need_email'));return;}
  if(document.getElementById('f-hp').value){ // 機器人填了隱藏欄位:假裝成功、不送出
    document.getElementById('f-result').style.display='block';return;
  }
  _sending=true;
  var btn=document.getElementById('f-btn');btn.disabled=true;
  var row={
    company:document.getElementById('f-company').value.trim().slice(0,200),
    email:email.slice(0,200),
    message:document.getElementById('f-msg').value.trim().slice(0,4000),
    notify_to:T('inquiry_to')
  };
  var r=await sb.from('inquiries').insert(row);
  _sending=false;btn.disabled=false;
  if(r.error){document.getElementById('f-error').style.display='block';return;}
  document.getElementById('f-result').style.display='block';
  ['f-company','f-email','f-msg'].forEach(function(id){document.getElementById(id).value='';});
}

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function toggleNav(){
  var nav=document.getElementById('navLinks');
  if(nav) nav.classList.toggle('open');
}
function setupNav(){
  var nav=document.getElementById('navLinks');
  if(!nav) return;
  nav.addEventListener('click',function(e){
    if(e.target.tagName==='A') nav.classList.remove('open');
  });
  window.addEventListener('resize',function(){
    if(window.innerWidth>640) nav.classList.remove('open');
  });
}

// 依 CFG 把所有文字、圖片、清單畫到頁面上
function applyConfig(){
  document.querySelectorAll('[data-k]').forEach(function(el){el.textContent=T(el.getAttribute('data-k'));});
  document.querySelectorAll('[data-ph]').forEach(function(el){el.placeholder=T(el.getAttribute('data-ph'));});
  document.title=T('site_title');
  var fav=document.querySelector('link[rel="icon"]');
  if(fav&&T('site_favicon')) fav.href=T('site_favicon');
  var lg=document.getElementById('logo-img');
  if(lg){ if(T('logo_img')) lg.src=T('logo_img'); lg.alt=T('alt_logo'); }

  // 首頁亮點
  document.getElementById('hero-stats').innerHTML=(T('hero_stats')||[]).map(function(s){
    return '<div class="hero-stat"><div class="hero-stat-num">'+esc(s.num)+'</div><div class="hero-stat-label">'+esc(s.label)+'</div></div>';
  }).join('');
  // 首頁大圖
  var h=document.getElementById('hero-img'),ph=document.getElementById('hero-img-ph');
  h.alt=T('alt_hero');
  if(T('hero_img')){
    h.onload=function(){h.classList.add('loaded');if(ph)ph.style.display='none';};
    h.src=T('hero_img');
  }
  // 關於我們
  var pts=document.getElementById('about-points');
  pts.innerHTML=(T('about_points')||[]).map(function(p){
    return '<div class="about-pt"><div class="about-pt-icon">'+esc(p.icon)+'</div><div><div class="about-pt-title">'+esc(p.title)+'</div><div class="about-pt-desc">'+esc(p.desc)+'</div></div></div>';
  }).join('');
  if(T('about_img')){
    var b=document.getElementById('about-img');
    var sc=parseFloat(T('about_img_scale'))||1, tx=parseFloat(T('about_img_x'))||0, ty=parseFloat(T('about_img_y'))||0;
    b.innerHTML='<img src="'+esc(T('about_img'))+'" alt="'+esc(T('alt_about'))+'" style="position:absolute;top:50%;left:50%;transform:translate(calc(-50% + '+tx+'px), calc(-50% + '+ty+'px)) scale('+sc+');transform-origin:center;width:100%;"/>';
  }
  // 公司環境照片
  var gal=(T('gallery_imgs')||[]).filter(function(g){return g&&g.img;});
  document.getElementById('gallery').style.display=gal.length?'':'none';
  document.getElementById('nav-gallery').style.display=gal.length?'':'none';
  document.getElementById('gallery-desc').style.display=T('gallery_desc')?'':'none';
  document.getElementById('gallery-grid').innerHTML=gal.map(function(g){
    return '<div class="gal-item"><img src="'+esc(g.img)+'" alt="'+esc(g.caption||T('gallery_title'))+'" loading="lazy"/>'+(g.caption?'<div class="gal-cap">'+esc(g.caption)+'</div>':'')+'</div>';
  }).join('');
  // 解決方案
  document.getElementById('sol-grid').innerHTML=(T('sol_cards')||[]).map(function(c){
    var tags=String(c.tags||'').split(/[,，]/).map(function(t){return t.trim();}).filter(Boolean)
      .map(function(t){return '<span class="sol-tag">'+esc(t)+'</span>';}).join('');
    return '<div class="sol-card"><div class="sol-icon">'+esc(c.icon)+'</div><div class="sol-title">'+esc(c.title)+'</div><div class="sol-desc">'+esc(c.desc)+'</div><div class="sol-tags">'+tags+'</div></div>';
  }).join('');
  // 聯絡資訊(各自勾選是否顯示)
  var rows='';
  function row(icon,txt){var a=[].concat(txt);rows+='<div class="contact-row"><div class="c-icon">'+icon+'</div><div class="c-text">'+a.map(esc).join('<br>')+'</div></div>';}
  if(T('show_email')==='1'&&T('contact_email')) row('📧',T('contact_email'));
  if(T('show_person')==='1'&&T('contact_person')) row('👤',T('contact_person'));
  if(T('show_phone')==='1'&&T('contact_phone')) row('📞',T('contact_phone'));
  if(T('show_line')==='1'&&T('contact_line')) row('💬','LINE: '+T('contact_line'));
  if(T('show_web')==='1'&&T('contact_web')) row('🌐',T('contact_web'));
  var addrs=[];
  if(T('show_addr')==='1'&&T('contact_addr')) addrs.push(T('contact_addr'));
  if(T('show_addr_en')==='1'&&T('contact_addr_en')) addrs.push(T('contact_addr_en'));
  if(addrs.length) row('📍',addrs);
  document.getElementById('contact-rows').innerHTML=rows;
  var mb=document.getElementById('map-box');
  var mq=T('map_query')||T('contact_addr');
  if(T('show_map')==='1'&&mq){
    mb.style.display='';
    mb.innerHTML='<iframe loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Google Map" src="https://maps.google.com/maps?q='+encodeURIComponent(mq)+'&z=16&output=embed"></iframe>';
  } else {mb.style.display='none';mb.innerHTML='';}
  renderCatTabs();
}

async function loadSiteSettings(){
  var {data}=await sb.from('site_settings').select('*');
  if(!data) return;
  var s={};
  data.forEach(function(r){s[r.key]=r.value;});
  CFG=zhieMerge(s);
  try{SIZE_IMGS_OVERRIDE=JSON.parse(s.size_imgs||'{}')||{};}catch(e){SIZE_IMGS_OVERRIDE={};}
  applyConfig();
  if(allProducts.length) (currentView==='products'&&currentSize?showProducts(currentSize):renderSizes());
}

window.addEventListener('DOMContentLoaded',function(){applyConfig();loadProducts();loadSiteSettings();setupNav();});
</script>
</body>
</html>
